<h2>布拉格三天兩夜</h2>
<p class="meta">捷克 ・ 2025/10/06 – 10/08</p>
<p class="jump" style="background:none;padding:0"><a href="../#trip">← 旅行</a><a href="#spots">景點</a><a href="#food">食物</a><a href="#snaps">隨手拍</a></p>

<h3 id="spots">景點</h3>
<p>查理大橋是連接布拉格的舊城區跟小城區。假日來的話，橋上會有很多藝術家擺攤，所以買了一個很可愛的磁鐵。再來就是各種去到布拉格會去景點，看了天文鐘，去了卡夫卡博物館。最喜歡的地方是小城區，有很多可以逛的小店，其中最喜歡的是逛到一家木偶店，超級漂亮！另外，每家的紀念品價格都不一樣，所以可以多看看再決定！在布拉格城堡的路上也會經過星巴克，沿途可以眺望風景。</p>
