<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somewhere in Berlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Huninn&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="flower" aria-hidden="true">
<svg viewBox="-30 -30 60 60"><g fill="#ffe14d" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
<ellipse cy="-14" rx="8" ry="12"/><ellipse cy="-14" rx="8" ry="12" transform="rotate(72)"/><ellipse cy="-14" rx="8" ry="12" transform="rotate(144)"/><ellipse cy="-14" rx="8" ry="12" transform="rotate(216)"/><ellipse cy="-14" rx="8" ry="12" transform="rotate(288)"/>
<circle r="7" fill="#fff"/></g></svg>
</div>

<header>
<a class="logo" href="#home" id="logo"></a>
<button id="burger" aria-label="menu" aria-expanded="false"><i></i><i></i><i></i></button>
</header>

<div id="menu">
<a href="#home" data-t="home"></a>
<a href="#about" data-t="about"></a>
<a href="#photo" data-t="photo"></a>
<a href="#trip" data-t="trip"></a>
<a href="#art" data-t="art"></a>
<button class="lang" id="lang">EN</button>
</div>

<main>
<section class="view hero" id="home">
<h1 id="bigname"></h1>
<p class="sub" data-t="heroSub"></p>
<div class="flip" id="flip" tabindex="0" role="button">
<div class="flip-in">
<div class="side front" id="postcard"></div>
<div class="side back"><div class="introtxt" data-t="intro"></div></div>
</div>
<span class="hint" data-t="flipHint"></span>
</div>
<div class="quick">
<a href="#photo" data-t="goPhoto"></a>
<a href="#trip" data-t="goTrip"></a>
<a href="#art" data-t="goArt"></a>
</div>
</section>

<section class="view" id="about">
<h2 data-t="about"></h2>
<div class="box"><p data-t="aboutBody"></p></div>
</section>

<section class="view" id="photo"><h2 data-t="photo"></h2><div class="grid" data-cat="photo"></div></section>
<section class="view" id="trip"><h2 data-t="trip"></h2><div class="grid" data-cat="trip"></div></section>
<section class="view" id="art"><h2 data-t="art"></h2><div class="grid" data-cat="art"></div></section>
</main>

<footer>✿ <span id="yr"></span> ✿</footer>
<div id="lb"><img alt=""></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
