<section class="view" id="about">
<h2 data-zh="關於我" data-en="About me"></h2>
<div class="box">
<p data-zh="在柏林的某個角落，留下了一些什麼。有太多值得回憶和記錄的東西，但卻無處下手。

所以這裡記錄著我在德國柏林交換期間的生活、旅行足跡，以及那些值得珍藏的日常。從陌生的城市開始，慢慢認識不同的文化，也重新發現生活中那些平凡卻珍貴的瞬間。

不喜歡走路，卻在這一年瘋狂暴走。用文字與照片留下生活的痕跡。希望透過這個網站，分享我在柏林看見的風景、遇見的人，以及那些只屬於這段旅程的故事。

不要再偷懶了！要整理！。" data-en="Somewhere in a corner of Berlin, a little piece of my story was left behind. There are so many moments worth remembering and documenting, yet I never quite know where to begin.

This website is a collection of my life in Berlin during my exchange year in Germany — the places I traveled to, the everyday moments I want to hold on to, and the memories that made this journey special. Starting from a city that once felt unfamiliar, I gradually came to understand different cultures and rediscover the beauty of ordinary, yet precious, moments in life.

I’ve never been a fan of walking, yet somehow, I spent this year walking more than ever. Through words and photographs, I hope to preserve little traces of this chapter of my life and share the sights I saw, the people I met, and the stories that belong only to this journey.

A little reminder to myself: Stop being lazy and start organizing all those memories!"></p>
